<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover : essentiel pour les encoches iPhone (Safe Area)
      user-scalable=no   : empêche le zoom (requis pour une app native)
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- iOS full-screen web app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Napoleon Hill AI">

    <!-- Theme color (Android Chrome + Safari) -->
    <meta name="theme-color" content="#1a2b48">

    <!-- Désactiver la détection automatique des numéros de téléphone -->
    <meta name="format-detection" content="telephone=no">

    <title>Napoleon Hill AI</title>

    <!-- Tailwind CSS (via CDN pour le prototype) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Polices Google -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    >

    <style>
      /* Fond uniforme avant le chargement de React — évite le flash blanc */
      html, body {
        background-color: #1a2b48 !important;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        /* Désactiver le rebond iOS natif sur le body */
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        /*
          Fallback emoji OBLIGATOIRE pour WKWebView (iOS Simulator & device).
          Sans 'Apple Color Emoji' explicite, les emoji s'affichent en carré ?.
          -apple-system en premier force le rendu système natif d'iOS.
        */
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto,
                     'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
      }

      #root {
        height: 100%;
        background-color: #1a2b48;
      }

      /* Désactiver la sélection de texte pour une UX native */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /* Permettre la sélection dans les champs de texte */
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      /* Typographie — emoji fallback inclus dans les deux stacks */
      .font-serif {
        font-family: 'Playfair Display', Georgia, serif,
                     'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji';
      }

      /* Bouton doré avec dégradé */
      .btn-gold {
        background: linear-gradient(135deg, #f1d27b 0%, #d4af37 100%);
        color: #1a2b48;
      }

      /* Effet shimmer sur les boutons premium */
      .shimmer {
        position: relative;
        overflow: hidden;
      }
      .shimmer::after {
        content: '';
        position: absolute;
        top: -50%; left: -100%; width: 200%; height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
        transform: rotate(45deg);
        animation: shimmerMove 3s infinite;
      }

      /* Animations */
      @keyframes shimmerMove {
        0%   { transform: translateX(-150%) rotate(45deg); }
        100% { transform: translateX(150%) rotate(45deg); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px) scale(0.95); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      .animate-fadeIn  { animation: fadeIn  0.2s ease-out; }
      .animate-slideUp { animation: slideUp 0.3s ease-out; }
    </style>
    <script type="module" crossorigin src="./assets/index-CrUCUxIQ.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
