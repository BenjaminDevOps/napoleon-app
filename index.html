
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a2b48">
    <title>Napoleon Hill AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="manifest" href="/manifest.json">
    <style>
      :root {
        --bg-deep: #0a0a1a;
        --gold: #d4af37;
        --gold-light: #f1d27b;
        --gold-glow: rgba(212, 175, 55, 0.35);
        --orb-purple: rgba(99, 60, 180, 0.55);
        --orb-indigo: rgba(55, 80, 200, 0.4);
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-bg-strong: rgba(255, 255, 255, 0.11);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-border-gold: rgba(212, 175, 55, 0.3);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.55);
        --text-muted: rgba(255, 255, 255, 0.25);
      }

      * { box-sizing: border-box; }

      body {
        font-family: 'Inter', 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Emoji', sans-serif;
        background-color: var(--bg-deep);
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      .font-serif {
        font-family: 'Playfair Display', 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Emoji', serif;
      }
      /* Force Apple Color Emoji on any element containing only an emoji */
      .emoji {
        font-family: 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Emoji', system-ui !important;
        font-style: normal;
        font-weight: normal;
        line-height: 1;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 0px; }

      /* ── Glass utility classes ── */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid var(--glass-border);
      }
      .glass-strong {
        background: var(--glass-bg-strong);
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
        border: 1px solid rgba(255,255,255,0.18);
      }
      .glass-gold {
        background: rgba(212, 175, 55, 0.08);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border-gold);
      }
      .tab-bar-glass {
        background: rgba(8, 8, 22, 0.82);
        backdrop-filter: blur(48px) saturate(180%);
        -webkit-backdrop-filter: blur(48px) saturate(180%);
        border-top: 1px solid rgba(255,255,255,0.07);
      }

      /* ── Gold button ── */
      .btn-gold {
        background: linear-gradient(135deg, #c9a227 0%, #f1d27b 45%, #c9a227 100%);
        box-shadow: 0 6px 24px rgba(212, 175, 55, 0.35), 0 1px 0 rgba(255,255,255,0.2) inset;
        color: #0a0a1a;
        font-weight: 800;
      }
      .btn-gold:active { transform: scale(0.97); }

      /* ── Shimmer ── */
      .shimmer { position: relative; overflow: hidden; }
      .shimmer::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
        animation: shimmer-sweep 2.8s ease-in-out infinite;
      }
      @keyframes shimmer-sweep {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(120%); }
      }

      /* ── Floating orbs ── */
      @keyframes orb-drift-1 {
        0%,100% { transform: translate(0, 0) scale(1); }
        33%  { transform: translate(40px, -50px) scale(1.08); }
        66%  { transform: translate(-30px, 30px) scale(0.93); }
      }
      @keyframes orb-drift-2 {
        0%,100% { transform: translate(0, 0) scale(1); }
        40%  { transform: translate(-60px, 40px) scale(1.12); }
        75%  { transform: translate(50px, -20px) scale(0.9); }
      }
      @keyframes orb-drift-3 {
        0%,100% { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(20px, 60px) scale(1.06); }
      }
      .orb-1 { animation: orb-drift-1 14s ease-in-out infinite; }
      .orb-2 { animation: orb-drift-2 18s ease-in-out infinite; animation-delay: -6s; }
      .orb-3 { animation: orb-drift-3 11s ease-in-out infinite; animation-delay: -3s; }

      /* ── Entrance animations ── */
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(22px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.88); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes slide-up-tab {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .anim-fade-up   { animation: fade-up 0.55s cubic-bezier(0.22,1,0.36,1) both; }
      .anim-fade-in   { animation: fade-in 0.4s ease both; }
      .anim-scale-in  { animation: scale-in 0.5s cubic-bezier(0.22,1,0.36,1) both; }
      .anim-slide-tab { animation: slide-up-tab 0.38s cubic-bezier(0.22,1,0.36,1) both; }

      /* ── Stagger delays ── */
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
      .delay-300 { animation-delay: 0.3s; }
      .delay-400 { animation-delay: 0.4s; }
      .delay-500 { animation-delay: 0.5s; }
      .delay-600 { animation-delay: 0.6s; }

      /* ── Glow pulse ── */
      @keyframes glow-pulse {
        0%,100% { box-shadow: 0 0 16px var(--gold-glow); }
        50%      { box-shadow: 0 0 40px rgba(212,175,55,0.6), 0 0 80px rgba(212,175,55,0.2); }
      }
      .glow-pulse { animation: glow-pulse 3s ease-in-out infinite; }

      /* ── Breathing circle (affirmations) ── */
      @keyframes breathe {
        0%,100% { transform: scale(1); opacity: 0.6; }
        50%      { transform: scale(1.18); opacity: 1; }
      }
      .breathe { animation: breathe 5s ease-in-out infinite; }

      /* ── Bounce dots (typing) ── */
      @keyframes bounce-dot {
        0%,80%,100% { transform: translateY(0); }
        40%          { transform: translateY(-6px); }
      }
      .dot-1 { animation: bounce-dot 1.2s ease-in-out infinite; }
      .dot-2 { animation: bounce-dot 1.2s ease-in-out infinite 0.2s; }
      .dot-3 { animation: bounce-dot 1.2s ease-in-out infinite 0.4s; }

      /* ── Tab pop ── */
      @keyframes tab-pop {
        0%   { transform: scale(1) translateY(0); }
        40%  { transform: scale(1.22) translateY(-3px); }
        100% { transform: scale(1) translateY(0); }
      }
      .tab-pop { animation: tab-pop 0.35s cubic-bezier(0.34,1.56,0.64,1); }

      /* ── Challenge check ── */
      @keyframes check-in {
        from { transform: scale(0) rotate(-20deg); opacity: 0; }
        to   { transform: scale(1) rotate(0); opacity: 1; }
      }
      .check-in { animation: check-in 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }

      /* ── Card swipe hint ── */
      @keyframes swipe-hint {
        0%,100% { transform: translateX(0); }
        30%      { transform: translateX(-8px); }
        60%      { transform: translateX(4px); }
      }
      .swipe-hint { animation: swipe-hint 2.5s ease-in-out 1.5s 1; }

      /* ── Safe area helpers ── */
      .pt-safe  { padding-top: env(safe-area-inset-top); }
      .pb-safe  { padding-bottom: env(safe-area-inset-bottom); }
      .mt-safe  { margin-top: env(safe-area-inset-top); }
    </style>

{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

</script>

    <div id="root"></div>
