<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover : essentiel pour les encoches iPhone (Safe Area)
      user-scalable=no   : empêche le zoom (requis pour une app native)
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- iOS full-screen web app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Napoleon Hill AI">

    <!-- Theme color (Android Chrome + Safari) -->
    <meta name="theme-color" content="#1a2b48">

    <!-- Désactiver la détection automatique des numéros de téléphone -->
    <meta name="format-detection" content="telephone=no">

    <title>Napoleon Hill AI</title>

    <!-- Tailwind CSS (via CDN pour le prototype) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Polices Google -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    >

    <style>
      /* ── Design Tokens ──────────────────────────────────────────────── */
      :root {
        --c-navy:       #1a2b48;
        --c-navy-deep:  #0d1826;
        --c-gold:       #d4af37;
        --c-gold-light: #f1d27b;
        --c-gold-dark:  #b8941f;
        --glass-bg:     rgba(255, 255, 255, 0.06);
        --glass-border: rgba(255, 255, 255, 0.10);
        --glass-blur:   blur(24px);
        --shadow-gold:  0 0 40px rgba(212,175,55,0.25), 0 0 80px rgba(212,175,55,0.10);
      }

      /* ── Base ───────────────────────────────────────────────────────── */
      html, body {
        background-color: var(--c-navy) !important;
        margin: 0; padding: 0;
        height: 100%; width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto,
                     'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
      }

      #root {
        height: 100%;
        background-color: var(--c-navy);
      }

      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }

      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      /* ── Typography ─────────────────────────────────────────────────── */
      .font-serif {
        font-family: 'Playfair Display', Georgia, serif;
      }

      /* ── Glassmorphism ──────────────────────────────────────────────── */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
      }

      .glass-dark {
        background: rgba(13, 24, 38, 0.88);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
      }

      .glass-tab {
        background: rgba(10, 18, 30, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      /* ── Gold Effects ───────────────────────────────────────────────── */
      .glow-gold {
        box-shadow: var(--shadow-gold);
      }

      .border-gold {
        border: 1px solid rgba(212,175,55,0.35);
      }

      /* ── Buttons ────────────────────────────────────────────────────── */
      .btn-gold {
        background: linear-gradient(135deg, var(--c-gold-light) 0%, var(--c-gold) 50%, var(--c-gold-dark) 100%);
        color: var(--c-navy-deep);
        font-weight: 900;
        transition: filter 0.15s ease, transform 0.15s ease;
      }
      .btn-gold:active {
        filter: brightness(0.9);
        transform: scale(0.97);
      }

      /* ── Shimmer ────────────────────────────────────────────────────── */
      .shimmer { position: relative; overflow: hidden; }
      .shimmer::after {
        content: '';
        position: absolute;
        top: -50%; left: -100%; width: 200%; height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255,255,255,0.22), transparent);
        transform: rotate(45deg);
        animation: shimmerMove 3s infinite;
        pointer-events: none;
      }

      /* ── Keyframes ──────────────────────────────────────────────────── */
      @keyframes shimmerMove {
        0%   { transform: translateX(-150%) rotate(45deg); }
        100% { transform: translateX(150%) rotate(45deg); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(22px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.82); }
        to   { opacity: 1; transform: scale(1); }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(44px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0)   scale(1); }
      }

      @keyframes slideInBottom {
        from { transform: translateY(100%); }
        to   { transform: translateY(0); }
      }

      @keyframes pulseGold {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50%      { opacity: 1;   transform: scale(1.08); }
      }

      @keyframes rotateSlow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
      }

      /* ── Animation Classes ──────────────────────────────────────────── */
      .animate-fadeIn       { animation: fadeIn       0.25s ease-out both; }
      .animate-fadeInUp     { animation: fadeInUp     0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .animate-scaleIn      { animation: scaleIn      0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .animate-slideUp      { animation: slideUp      0.40s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .animate-slideInBottom{ animation: slideInBottom 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .animate-pulseGold    { animation: pulseGold    2s ease-in-out infinite; }
      .animate-fall         { animation: fall linear forwards; }

      /* ── Stagger delays ─────────────────────────────────────────────── */
      .delay-100 { animation-delay: 0.10s; }
      .delay-200 { animation-delay: 0.20s; }
      .delay-300 { animation-delay: 0.30s; }
      .delay-400 { animation-delay: 0.40s; }
      .delay-500 { animation-delay: 0.50s; }
      .delay-600 { animation-delay: 0.60s; }
      .delay-700 { animation-delay: 0.70s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
